plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.screenassistant'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.screenassistant"
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName "0.2.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation project(':ppocr-sdk')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.register('verifyLiveContract', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = tasks.named('testDebugUnitTest').get().classpath
    mainClass = 'com.screenassistant.LiveContractProbe'
    args providers.gradleProperty('liveContractBase').getOrElse('')
}
